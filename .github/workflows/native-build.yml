name: native build
# Builds the Native Client edition of Horizon's game client (MIT licensed, NATIVE.md): the newest upstream
# Nightly's source, rebranded by tools/native/rebrand.py, with the Native launch screen (boot_screen.py) and the Minecraft Java Edition icon (make_vanilla_icon.py). Publishes the Windows client as
# the release `native-<date>-<commit>` named after the upstream Nightly it matches. The Native launcher installs
# upstream's signed engine for that Nightly and swaps in this client.
on:
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if this Nightly already has a Native release
        type: boolean
        default: false
      nightly:
        description: Release tag to build (native-YYYY-MM-DD-<commit>); empty builds the newest Nightly
        type: string
        default: ''
      suffix:
        description: Suffix for a new release of the selected Nightly
        type: string
        default: ''
permissions:
  contents: write
concurrency:
  group: native-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM: horizon-rust/horizon
    steps:
      - uses: actions/checkout@v4
        with:
          path: native
      - name: Check emote patch encoding and idempotency
        run: python -m unittest discover -s native/tests -p test_native_emotes_patch.py
      - name: Find the upstream Nightly
        id: up
        env:
          REQUESTED: ${{ inputs.nightly }}
          SUFFIX: ${{ inputs.suffix }}
        run: |
          python - <<'PY'
          import json, os, re, subprocess
          requested = (os.environ.get('REQUESTED') or '').strip()
          if requested:
              # Rebuild a client for the Nightly a player already has installed.
              m = re.match(r'^native-(\d{4}-\d{2}-\d{2})-([0-9a-f]{7,40})$', requested)
              if not m:
                  raise SystemExit(f'Unexpected release tag: {requested!r}')
              date, short = m.groups()
              name = f'Nightly {date} \u00b7 {short}'
          else:
              proc = subprocess.run(['gh', 'api', f"repos/{os.environ['UPSTREAM']}/releases/tags/nightly"], capture_output=True, text=True, encoding='utf-8')
              if proc.returncode != 0:
                  print(f"Upstream {os.environ['UPSTREAM']} nightly lookup unavailable ({proc.stderr.strip()}); skipping scheduled build.")
                  with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
                      f.write('available=false\n')
                  raise SystemExit(0)
              name = json.loads(proc.stdout)['name']
              m = re.match(r'^Nightly (\d{4}-\d{2}-\d{2}) \u00b7 ([0-9a-f]+)$', name)
              if not m:
                  raise SystemExit(f'Unexpected Nightly title: {name!r}')
              date, short = m.groups()
          suffix = os.environ.get('SUFFIX', '').strip()
          if suffix and (not requested or not re.fullmatch(r'[a-zA-Z0-9][a-zA-Z0-9._-]{0,23}', suffix)):
              raise SystemExit('A release suffix needs a pinned Nightly and 1–24 letters, numbers, dots, underscores or hyphens.')
          tag = f'native-{date}-{short}' + (f'-{suffix}' if suffix else '')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f'available=true\ndate={date}\nshort={short}\ntag={tag}\nname={name}\n')
          PY
      - name: Skip when already built
        id: need
        run: |
          if [ "${{ steps.up.outputs.available }}" != "true" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Upstream Nightly unavailable; skipping."
          elif [ "${{ inputs.force }}" != "true" ] && gh release view "${{ steps.up.outputs.tag }}" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "${{ steps.up.outputs.tag }} already exists"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upstream source of that Nightly
        if: steps.need.outputs.build == 'true'
        run: |
          if ! GIT_TERMINAL_PROMPT=0 git clone --filter=blob:none "https://github.com/$UPSTREAM.git" src; then
            echo "Upstream $UPSTREAM unavailable; falling back to $GITHUB_REPOSITORY"
            rm -rf src
            GIT_TERMINAL_PROMPT=0 git clone --filter=blob:none "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" src
          fi
          cd src
          git checkout "nightly-source/${{ steps.up.outputs.date }}-${{ steps.up.outputs.short }}" 2> /dev/null || git checkout "${{ steps.up.outputs.short }}"
      - name: Rebrand, set the launch screen and the Java Edition icon
        if: steps.need.outputs.build == 'true'
        run: |
          python native/tools/native/rebrand.py src
          base64 -d native/packaging/native/icon64.png.b64 > src/crates/horizon-theme/icons/horizon-64.png
          python native/tools/native/boot_screen.py src native
          python native/tools/native/native_api.py src native
          python native/tools/native/native_skins.py src native
          python native/tools/native/native_marks.py src native
          python native/tools/native/native_cosmetics.py src native
          python native/tools/native/native_ui.py src native
          python native/tools/native/native_tweaks.py src native
          python native/tools/native/native_client.py src native
          python native/tools/native/native_emotes.py src native
          python -m pip install --quiet pillow
          python native/tools/native/make_vanilla_icon.py src/packaging/icons/horizon.ico src/crates/horizon-theme/icons/horizon-64.png
      - uses: dtolnay/rust-toolchain@stable
        if: steps.need.outputs.build == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.need.outputs.build == 'true'
        with:
          workspaces: src
          shared-key: native
      - name: Build the client
        if: steps.need.outputs.build == 'true'
        working-directory: src
        env:
          RUSTFLAGS: -C target-feature=+crt-static
          HORIZON_VERSION: nightly-${{ steps.up.outputs.date }}
          HORIZON_NIGHTLY: ${{ steps.up.outputs.date }} ${{ steps.up.outputs.short }}
        run: |
          # Since Nightly 2026-11-13 the game players get is horizon-official: horizon-client's game with Horizon's own
          # parts plugged in (Discord presence among them; horizon-client's own executable has none). Upstream ships it
          # under horizon-client's name (game-build.yml), and so does this.
          BIN=horizon-client
          if [ -d crates/horizon-official ]; then BIN=horizon-official; fi
          echo "NATIVE_BIN=$BIN" >> "$GITHUB_ENV"
          cargo build --release -p "$BIN" -p horizon-client-lib --bin "$BIN" -p horizon-prepare --bin horizon-prepare
      - name: Check it starts and has no foreign DLLs
        if: steps.need.outputs.build == 'true'
        working-directory: src
        run: |
          target/release/$NATIVE_BIN.exe --help | grep -q -- '--resources'
          target/release/horizon-prepare.exe --help | grep -q -- '--minecraft-dir'
          python tools/check_imports.py target/release/$NATIVE_BIN.exe target/release/horizon-prepare.exe
      - name: Publish
        if: steps.need.outputs.build == 'true'
        run: |
          rm -rf dist
          mkdir -p dist/horizon-windows-x64/crates
          git -C src archive --format=tar HEAD tools mods/horizon/src/test/java research-lock.json LICENSE | tar -x -C dist/horizon-windows-x64
          cp -R src/crates/horizon-prepare dist/horizon-windows-x64/crates/horizon-prepare
          cp "src/target/release/$NATIVE_BIN.exe" dist/horizon-client-windows-x64.exe
          cp "src/target/release/$NATIVE_BIN.exe" dist/horizon-windows-x64/horizon-client.exe
          cp "src/target/release/horizon-prepare.exe" dist/horizon-windows-x64/horizon-prepare.exe
          if [ -f src/packaging/PLAY.txt ]; then cp src/packaging/PLAY.txt dist/horizon-windows-x64/PLAY.txt; fi
          cd dist
          7z a -tzip horizon-windows-x64.zip horizon-windows-x64 > /dev/null
          sha256sum horizon-client-windows-x64.exe horizon-windows-x64.zip > SHA256SUMS
          printf '%s\n' '{"upstream_release":"${{ steps.up.outputs.name }}","upstream_commit":"${{ steps.up.outputs.short }}"}' > compat.json
          if [ "${{ inputs.force }}" = "true" ]; then
            gh release delete "${{ steps.up.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2> /dev/null || true
          fi
          # Launchers follow the latest *release*: a scheduled build of a new upstream Nightly is a pre-release
          # (for testing) and reaches no player; a build started by hand (release.bat) is the release players get.
          if [ "${{ github.event_name }}" = "schedule" ]; then CHANNEL=--prerelease; else CHANNEL=--latest; fi
          gh release create "${{ steps.up.outputs.tag }}" horizon-client-windows-x64.exe horizon-windows-x64.zip SHA256SUMS compat.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" $CHANNEL \
            --title "Native engine for ${{ steps.up.outputs.name }}" \
            --notes "Standalone Native Rust Edition bundle & client built from ${{ steps.up.outputs.name }} (MIT, see NATIVE.md)."
