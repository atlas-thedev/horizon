name: native check
# Compiles the Native Client edition (rebrand.py + boot_screen.py + the Java Edition icon on the newest upstream
# Nightly's source) on every change to those files, so a pull request shows a broken launch screen before
# the six-hourly build trips over it. It publishes nothing.
on:
  pull_request:
    paths:
      - 'tests/test_native_emotes_patch.py'
      - 'tests/test_native_rebrand_patch.py'
      - 'tools/native/**'
      - 'packaging/native/**'
      - '.github/workflows/native-*.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM: horizon-rust/horizon
    steps:
      - uses: actions/checkout@v4
        with:
          path: native
      - name: Check emote patch encoding and idempotency
        run: python -m unittest discover -s native/tests -p test_native_emotes_patch.py
      - name: Check branding preserves hook source markers
        run: python -m unittest discover -s native/tests -p test_native_rebrand_patch.py
      - name: Find the upstream Nightly
        id: up
        run: |
          python - <<'PY'
          import json, os, re, subprocess
          out = subprocess.check_output(['gh', 'api', f"repos/{os.environ['UPSTREAM']}/releases/tags/nightly"], text=True, encoding='utf-8')
          name = json.loads(out)['name']
          m = re.match(r'^Nightly (\d{4}-\d{2}-\d{2}) \u00b7 ([0-9a-f]+)$', name)
          if not m:
              raise SystemExit(f'Unexpected Nightly title: {name!r}')
          date, short = m.groups()
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f'date={date}\nshort={short}\ntag=native-{date}-{short}\nname={name}\n')
          PY
      - name: Upstream source of that Nightly
        run: |
          git clone --filter=blob:none "https://github.com/$UPSTREAM.git" src
          cd src
          git checkout "nightly-source/${{ steps.up.outputs.date }}-${{ steps.up.outputs.short }}" 2> /dev/null || git checkout "${{ steps.up.outputs.short }}"
      - name: Rebrand, set the launch screen and the Java Edition icon
        run: |
          python native/tools/native/rebrand.py src
          base64 -d native/packaging/native/icon64.png.b64 > src/crates/horizon-theme/icons/horizon-64.png
          python native/tools/native/boot_screen.py src native
          python native/tools/native/native_api.py src native
          python native/tools/native/native_skins.py src native
          python native/tools/native/native_marks.py src native
          python native/tools/native/native_cosmetics.py src native
          python native/tools/native/native_ui.py src native
          python native/tools/native/native_tweaks.py src native
          python native/tools/native/native_client.py src native
          python native/tools/native/native_emotes.py src native
          python -m pip install --quiet pillow
          python native/tools/native/make_vanilla_icon.py src/packaging/icons/horizon.ico src/crates/horizon-theme/icons/horizon-64.png
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
          shared-key: native-check
      - name: Compile the client
        working-directory: src
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo check -p horizon-client -p horizon-client-lib
      - name: The boot screen's own tests
        working-directory: src
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo test -p horizon-client --lib ui_theme
      - name: Native skins tests
        working-directory: src
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo test -p horizon-client-lib -p horizon-client-render --lib native_
          cargo test -p horizon-client --lib native_
